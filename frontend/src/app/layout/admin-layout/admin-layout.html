<div class="admin-shell">

  @if (sidebarOpen()) {
    <div class="sidebar-overlay" (click)="closeSidebar()"></div>
  }

  <aside class="admin-sidebar" [class.open]="sidebarOpen()">
    <div class="sidebar-brand">
      <span class="brand-mark">
        <img src="images/icon.png" alt="" />
      </span>
      <span class="brand-text">ShopSphere</span>
    </div>

    <nav class="sidebar-nav">
      <a routerLink="/admin" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" (click)="closeSidebar()">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="3" y="3" width="7" height="7" rx="1.5"/>
          <rect x="14" y="3" width="7" height="7" rx="1.5"/>
          <rect x="3" y="14" width="7" height="7" rx="1.5"/>
          <rect x="14" y="14" width="7" height="7" rx="1.5"/>
        </svg>
        <span>Dashboard</span>
      </a>

      <a routerLink="/admin/products" routerLinkActive="active" (click)="closeSidebar()">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M21 8l-9-5-9 5 9 5 9-5z"/>
          <path d="M3 8v8l9 5 9-5V8"/>
          <path d="M12 13v8"/>
        </svg>
        <span>Products</span>
      </a>

      <a routerLink="/admin/categories" routerLinkActive="active" (click)="closeSidebar()">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M20.6 12.6L12.4 20.8a2 2 0 01-2.8 0L3 14.2V4h10.2l7.4 7.4a2 2 0 010 2.8z"/>
          <circle cx="7.5" cy="7.5" r="1.3"/>
        </svg>
        <span>Categories</span>
      </a>

      <a routerLink="/admin/orders" routerLinkActive="active" (click)="closeSidebar()">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="5" y="3" width="14" height="18" rx="2"/>
          <path d="M9 3v2a1 1 0 001 1h4a1 1 0 001-1V3"/>
          <path d="M8 11h8M8 15h5"/>
        </svg>
        <span>Orders</span>
      </a>

      <a routerLink="/admin/coupons" routerLinkActive="active" (click)="closeSidebar()">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M3 10a2 2 0 002-2V6a2 2 0 012-2h10a2 2 0 012 2v2a2 2 0 002 2v4a2 2 0 00-2 2v2a2 2 0 01-2 2H7a2 2 0 01-2-2v-2a2 2 0 00-2-2v-4z"/>
          <path d="M9.5 9.5h.01M14.5 14.5h.01M9 15l6-6"/>
        </svg>
        <span>Coupons</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <a routerLink="/" class="back-to-store">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        <span>Back to Store</span>
      </a>
    </div>
  </aside>

  <div class="admin-main">
    <header class="admin-topbar">
      <button class="menu-toggle" (click)="toggleSidebar()" aria-label="Toggle menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M3 6h18M3 12h18M3 18h18"/>
        </svg>
      </button>

      <h1 class="page-title">{{ pageTitle() }}</h1>

      <div class="topbar-right">
        <div class="admin-profile">
          <span class="admin-avatar">{{ authService.currentUser()?.fullName?.charAt(0) }}</span>
          <span class="admin-name">{{ authService.currentUser()?.fullName }}</span>
        </div>
        <button class="logout-icon-btn" (click)="logout()" aria-label="Logout" title="Logout">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/>
            <path d="M16 17l5-5-5-5"/>
            <path d="M21 12H9"/>
          </svg>
        </button>
      </div>
    </header>

    <main class="admin-content">
      <router-outlet></router-outlet>
    </main>
  </div>

</div>
